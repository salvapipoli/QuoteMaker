<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuoteMaker — preventivi professionali, semplici." />
    <meta name="theme-color" content="#11233f" />
    <title>QuoteMaker</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard"><span class="brand-mark">Q</span>QuoteMaker</a>
        <nav aria-label="Navigazione principale">
          <button class="nav-link active" data-route="dashboard">Panoramica</button>
          <button class="nav-link" data-route="quotes">Preventivi</button>
          <button class="nav-link" data-route="settings">La mia attività</button>
        </nav>
        <button class="outline-button sidebar-backup" id="export-backup">Esporta backup</button>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <button id="account-button" class="account-button">Accedi</button>
          <label class="language-picker" for="language-menu"><span id="language-flag">🇮🇹</span><select id="language-menu" aria-label="Lingua"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="zh">中文</option></select></label>
        </header>
        <main id="app" class="main-content"></main>
      </section>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <!-- Per l'uso completamente offline, scaricare queste due librerie in vendor/ e aggiornare i percorsi. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
